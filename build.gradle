plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "BlameJared (JEI)"
		url = "https://maven.blamejared.com/"
		content { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"voltworks_quarry" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Voltworks Industrial: the quarry runs on its power network, uses its upgrades, pipes and wrench.
	// On the classpath it is also loaded as a mod in runClient / runClientGameTest.
	implementation files(project.voltworks_jar)

	// JEI is optional: the quarry adds info pages when it is installed.
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Automated in-world test: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "voltworks_quarry_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

// The in-game test runs with the full JEI, so the info pages are registered for real.
dependencies {
	gametestRuntimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}
